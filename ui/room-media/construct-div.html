<div style="width:100%;height:100%;overflow:auto;background:#101416;">
  <link rel="stylesheet" href="assets/room-media/styles.css">

  <style>
    #room-media-construct.rm {
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
    }
  </style>

  <div id="room-media-construct"></div>

  <script src="assets/room-media/join-map.js"></script>
  <script src="assets/room-media/catalog.js"></script>
  <script src="assets/room-media/crestron-bridge.js"></script>
  <script src="assets/room-media/app.js"></script>

  <script>
    (function () {
      var root = document.getElementById('room-media-construct');
      if (!root || root.dataset.mounted) return;

      var config = window.ROOM_MEDIA_CONFIG;
      if (!config || !window.RoomMediaApp || !window.CrestronRoomBridge) {
        root.textContent = 'Room media assets did not load. Check their paths.';
        return;
      }
      if (!config.enabled) {
        root.textContent = 'Configure and enable the room join map for live control.';
        return;
      }
      if (!window.CrComLib) {
        root.textContent = 'Crestron communication library is not ready.';
        return;
      }

      // Construct owns the connection; no second Web XPanel is initialized.
      var settings = Object.assign({}, config, { browser: false });
      var bridge = new window.CrestronRoomBridge(window.CrComLib, settings);
      window.roomMediaView = window.RoomMediaApp.mount(root, { bridge: bridge });
    })();
  </script>
</div>
